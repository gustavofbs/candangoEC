<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Produto</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-label {
            font-weight: 500;
            color: #333;
            margin-bottom: 0.5rem;
        }
        .form-control {
            border-radius: 0.5rem;
            border: 1px solid #dee2e6;
            padding: 0.75rem;
        }
        .form-control:focus {
            border-color: #80bdff;
            box-shadow: 0 0 0 0.2rem rgba(0,123,255,.25);
        }
        textarea.form-control {
            min-height: 120px;
        }
        .card {
            border-radius: 1rem;
            border: none;
        }
        .btn-success {
            padding: 0.75rem;
            font-weight: 500;
            border-radius: 0.5rem;
        }
        /* Estilo para o preview da imagem */
        .image-preview {
            max-width: 200px;
            margin-top: 10px;
            border-radius: 0.5rem;
            display: none;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container mt-5 mb-5">
        <div class="card p-4 shadow-lg mx-auto" style="max-width: 600px;">
            <h2 class="text-center mb-4">{{ produto.nome|default:"Adicionar Produto" }}</h2>
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                {% for field in form %}
                    <div class="form-group">
                        <label class="form-label">{{ field.label }}</label>
                        {% if field.name == 'descricao' %}
                            <textarea name="{{ field.name }}" class="form-control" rows="4">{{ field.value|default:'' }}</textarea>
                        {% elif field.name == 'imagem' %}
                            <input type="{{ field.field.widget.input_type }}" 
                                   name="{{ field.name }}" 
                                   class="form-control"
                                   accept="image/*"
                                   onchange="previewImage(this)">
                            <img id="imagePreview" src="#" alt="Preview" class="image-preview">
                        {% else %}
                            <input type="{{ field.field.widget.input_type }}" 
                                   name="{{ field.name }}" 
                                   value="{{ field.value|default:'' }}"
                                   class="form-control"
                                   {% if field.field.required %}required{% endif %}>
                        {% endif %}
                        {% if field.errors %}
                            <div class="text-danger mt-1">
                                {{ field.errors }}
                            </div>
                        {% endif %}
                    </div>
                {% endfor %}
                <div class="mt-4">
                    <button type="submit" class="btn btn-success w-100">Salvar Produto</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function previewImage(input) {
            const preview = document.getElementById('imagePreview');
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                }
                reader.readAsDataURL(input.files[0]);
            }
        }
    </script>
</body>
</html>
